query SeriesBooks($series_id: Int!, $limit: Int!, $offset: Int!) {
  book_series(where: {series_id: {_eq: $series_id}}, order_by: {position: asc}, limit: $limit, offset: $offset) {
    position
    book { ...BookSummaryFields }
  }
}
fragment BookSummaryFields on books { id title slug release_year rating users_count cached_image }

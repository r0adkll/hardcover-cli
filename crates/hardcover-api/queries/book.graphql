query BookById($id: Int!) {
  books_by_pk(id: $id) {
    id
    title
    subtitle
    slug
    description
    pages
    release_year
    rating
    ratings_count
    reviews_count
    users_count
    cached_image
    book_series {
      position
      series { id name slug }
    }
    contributions {
      author { id name slug }
    }
  }
}

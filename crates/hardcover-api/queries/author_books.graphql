query AuthorBooks($author_id: Int!, $limit: Int!, $offset: Int!) {
  books(where: {contributions: {author_id: {_eq: $author_id}}}, order_by: {users_count: desc}, limit: $limit, offset: $offset) {
    ...BookSummaryFields
  }
}
fragment BookSummaryFields on books { id title slug release_year rating users_count cached_image }

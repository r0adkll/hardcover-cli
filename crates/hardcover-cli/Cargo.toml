[package]
name = "hardcover-cli"
description = "Command-line client for Hardcover.app, built for agents first"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "hardcover"
path = "src/main.rs"

[dependencies]
hardcover-api = { path = "../hardcover-api" }
clap = { version = "4", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
toml = "0.8"
directories = "5"
rmcp = { version = "3.1.4", features = ["server", "macros", "transport-io"] }
schemars = "1"
toml_edit = "0.22"
comfy-table = "7"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rmcp = { version = "3.1.4", features = ["client", "transport-child-process"] }
tempfile = "3"
wiremock.workspace = true

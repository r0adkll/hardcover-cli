[workspace]
resolver = "2"
members = ["crates/hardcover-api", "crates/hardcover-cli", "xtask"]
default-members = ["crates/hardcover-api", "crates/hardcover-cli"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/r0adkll/hardcover-cli"
homepage = "https://github.com/r0adkll/hardcover-cli"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
wiremock = "0.6"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
